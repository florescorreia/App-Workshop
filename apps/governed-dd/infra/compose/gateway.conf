map $host $dd_csp {
 default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
 "~^(paperclip|lab)-[a-f0-9]{24}\.localhost$" "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}
server {
 listen 8080;
 server_name _;
 access_log off;
 client_max_body_size 21m;
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $dd_identity http://keycloak:8080;
 set $dd_portal http://portal:8000;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 location /identity/ {
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
  proxy_pass $dd_identity$request_uri;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Port $server_port;
 }
 location / {
  add_header Content-Security-Policy $dd_csp always;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_pass $dd_portal$request_uri;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 130s;
 }
}
