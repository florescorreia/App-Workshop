name: ideaflow
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ideaflow}
      POSTGRES_USER: ${POSTGRES_USER:-ideaflow_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init-env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  backend:
    image: ideaflow-backend:1.2.0
    pull_policy: never
    build: ./backend
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER:-ideaflow_migrator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ideaflow}
      DATABASE_URL: postgresql+psycopg://ideaflow_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-ideaflow}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ideaflow.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run init-env}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/New_York}
    volumes:
      - ./demo:/demo:ro
      - ./local:/handover
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  frontend:
    image: ideaflow-frontend:1.2.0
    pull_policy: never
    build: ./frontend
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/api/health/ready]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  pgdata:
    name: ideaflow_pgdata
