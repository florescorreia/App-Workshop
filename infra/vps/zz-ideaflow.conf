[Service]
# Stop the three members while the old rootless namespace is still alive.
# Scope this drop-in to user@1001.service, the dedicated IdeaFlow account.
TimeoutStopSec=180
ExecStop=/usr/bin/env XDG_RUNTIME_DIR=/run/user/1001 /usr/bin/systemctl --user stop app-ideaflow.target ideaflow-frontend.service ideaflow-backend.service ideaflow-postgres.service
